syntax = "proto3";

package pb;

option go_package = "aifl-backend/proto/pb";

message ContactUsProto {
  string id = 1;
  string name = 2;
  string email = 3;
  string company = 4;
  string subject = 5;
  string message = 6;
  string status = 7;
  string created_at = 8;
}

message CreateContactRequestProto {
  string name = 1;
  string email = 2;
  string company = 3;
  string subject = 4;
  string message = 5;
}

message ContactListResponseProto {
  bool success = 1;
  string message = 2;
  repeated ContactUsProto contacts = 3;
  string error = 4;
}
