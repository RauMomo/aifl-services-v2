syntax = "proto3";

package pb;

option go_package = "aifl-backend/proto/pb";

message ProjectProto {
  string id = 1;
  string title = 2;
  string slug = 3;
  string description = 4;
  string category = 5;
  string client_name = 6;
  string image_url = 7;
  repeated string tags = 8;
  repeated string impact_metrics = 9;
  bool is_featured = 10;
  string created_at = 11;
}

message CreateProjectRequestProto {
  string title = 1;
  string slug = 2;
  string description = 3;
  string category = 4;
  string client_name = 5;
  string image_url = 6;
  repeated string tags = 7;
  repeated string impact_metrics = 8;
  bool is_featured = 9;
}

message ProjectListResponseProto {
  bool success = 1;
  string message = 2;
  repeated ProjectProto projects = 3;
  string error = 4;
}

message ProjectResponseProto {
  bool success = 1;
  string message = 2;
  ProjectProto project = 3;
  string error = 4;
}
